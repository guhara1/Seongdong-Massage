name: IndexNow 색인 통보

# main 브랜치에 콘텐츠가 푸시될 때(= Cloudflare Pages 배포 트리거 시)
# IndexNow 참여 검색엔진(빙·네이버 등)에 변경 URL을 즉시 통보한다.
on:
  push:
    branches: [main]
    paths:
      - "**/index.html"
      - "sitemap.xml"
  workflow_dispatch:

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Cloudflare Pages 배포가 끝날 시간을 잠시 기다린 뒤 통보
      - name: 배포 대기
        run: sleep 90
      - name: IndexNow 제출
        run: python3 scripts/ping_indexnow.py
